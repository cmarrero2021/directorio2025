server {
    listen 80;
    listen [::]:80;

    server_name directorio.oncti.gob.ve;

    root /var/www/html/directorio/frontend;
    index index.html;

    access_log /var/log/nginx/directorio_access.log;
    error_log  /var/log/nginx/directorio_error.log;

    # ============================================================
    # Backend API — proxea a Node.js en puerto 4000
    # La barra final en proxy_pass elimina el prefijo /api/
    # Ej: /api/recientes  →  localhost:4000/recientes
    # ============================================================
    location ^~ /api/ {
        proxy_pass http://localhost:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (por si el backend lo necesita en rutas /api/)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        proxy_buffering off;
    }

    # ============================================================
    # Auth API — proxea a Node.js en puerto 4100
    # Sin barra final: mantiene /auth/ en el path
    # Ej: /auth/login  →  localhost:4100/auth/login
    # ============================================================
    location ^~ /auth/ {
        proxy_pass http://localhost:4100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # ============================================================
    # WebSocket dedicado — proxea a Node.js en puerto 4000
    # Ej: ws://directorio.oncti.gob.ve/ws  →  localhost:4000/ws
    # ============================================================
    location ^~ /ws {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;

        proxy_buffering off;
    }

    # ============================================================
    # Frontend Quasar (SPA) — archivos estáticos
    # Debe ir al final para no interceptar /api/ ni /auth/
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (incluyendo otf)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
